name: Generate Finance Video

on:
  schedule:
    # Run every other day: Monday, Wednesday, Friday at 10:00 UTC (one day on, one day off)
    - cron: '0 10 * * 1,3,5'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Remotion
        uses: browser-actions/setup-chrome@v1

      - name: Install ffmpeg and espeak-ng for audio processing
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Kokoro TTS
        run: |
          pip install kokoro>=0.9.4 soundfile numpy
          python3 -c "from kokoro import KPipeline; KPipeline(lang_code='a')" || echo 'Kokoro model download test'

      - name: Generate video
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: meta/llama-3.1-8b-instruct
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          KOKORO_VOICE: am_michael
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node agent/index.js

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-video
          path: out/video.mp4
