name: Generate Finance Video

on:
  schedule:
    - cron: '0 10 * * 1,3,5'
  workflow_dispatch:

concurrency:
  group: generate-video
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Remotion
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ffmpeg and espeak-ng for audio processing
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg espeak-ng

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: hf-cache-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Kokoro TTS
        run: |
          pip install -r requirements.txt
          python3 -c "from kokoro import KPipeline; KPipeline(lang_code='a')"

      - name: Generate video
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: meta/llama-3.1-8b-instruct
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          KOKORO_VOICE: am_michael
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node agent/index.js

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-video
          path: out/video.mp4
          if-no-files-found: warn
