name: Generate Finance Video

on:
  schedule:
    - cron: '0 10 */2 * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Remotion
        uses: browser-actions/setup-chrome@v1

      - name: Install ffmpeg for audio processing
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Install Python edge-tts for TTS narration
        run: pip install --user edge-tts

      - name: Generate video
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: meta/llama-3.1-8b-instruct
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node agent/index.js

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-video
          path: out/video.mp4
